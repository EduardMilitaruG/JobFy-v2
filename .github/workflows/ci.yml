name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npx prisma generate
        working-directory: packages/backend
      - run: npm run typecheck --workspaces --if-present
      - run: npm run lint --workspaces --if-present

  test-backend:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobfy
          POSTGRES_PASSWORD: jobfy
          POSTGRES_DB: jobfy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobfy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://jobfy:jobfy@localhost:5432/jobfy_test
      # src/config/env.ts requires a non-empty key at import time. Tests never
      # call Groq, so a placeholder is enough.
      GROQ_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npx prisma generate
        working-directory: packages/backend
      # Apply the committed migrations; `migrate dev` is for creating new ones.
      - run: npx prisma migrate deploy
        working-directory: packages/backend
      - run: npm test -w packages/backend

  test-frontend:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npm test -w packages/frontend

  # E2E tests live in EduardMilitaruG/jobfy-playwright-tests (Playwright),
  # which checks out this repo and runs against it.

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.prod.yml build
